<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球汽车法规差异化对比平台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- 引入 jsPDF 用于PDF导出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- 引入 html2canvas 用于PDF导出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 jsPDF 中文支持 -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <!-- 引入 Supabase JS 库（异步加载，不阻塞页面） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" ></script>
    <style>
        [x-cloak] { display: none !important; }
        /* 差异等级颜色定义 */
        .diff-high { background-color: #fee2e2; border-left: 4px solid #ef4444; } /* 不满足 */
        .diff-med { background-color: #fef3c7; border-left: 4px solid #f59e0b; } /* 开放点/需测试 */
        .diff-low { background-color: #d1fae5; border-left: 4px solid #10b981; } /* 满足 */
        
        .sticky-header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); background-color: rgba(255,255,255,0.95); }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" x-data="autoRegApp()" x-init="init()">

    <!-- 顶部导航与全局筛选 -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky-header">
        <div class="w-full mx-auto px-4 py-2">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-indigo-900 inline-flex items-center gap-3" x-text="t('title')">AutoReg Global Compare</h1>
                    <span class="inline-flex items-center gap-1 ml-2 px-2 py-0.5 rounded-full text-[11px] font-medium"
                          :class="dbConnected ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">
                        <span class="w-2 h-2 rounded-full" :class="dbConnected ? 'bg-green-500' : 'bg-red-400'"></span>
                        <span x-text="dbConnected ? (lang==='zh' ? '云端已连接' : 'Cloud Connected') : (lang==='zh' ? '离线模式' : 'Offline')"></span>
                    </span>
                </div>
                
                <!-- 视图切换器 -->
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button x-text="t('matrix')" @click="currentView = 'matrix'" :class="currentView === 'matrix' ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-2 rounded-md text-sm font-medium transition">矩阵对比</button>
                    <button x-text="t('item')" @click="currentView = 'item'" :class="currentView === 'item' ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-2 rounded-md text-sm font-medium transition">按条目查阅</button>
                    <button x-text="t('country')" @click="currentView = 'country'" :class="currentView === 'country' ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-2 rounded-md text-sm font-medium transition">按市场查阅</button>
                    <button @click="lang = lang === 'zh' ? 'en' : 'zh'"class="bg-gray-200 px-3 py-1 rounded text-sm"><span x-text="lang === 'zh' ? 'EN' : '中文'"></span></button>
                </div>
            </div>

            <!-- 全局过滤器 -->
            <div class="mt-4 flex flex-wrap gap-3 items-center">
                <span x-text="t('filter')" class="text-sm font-semibold text-gray-600"></span>
                
                <!-- 组别筛选（下拉多选） -->
<div class="relative" x-ref="groupFilterWrap">
    <button @click="openGroupDropdown()"
        class="border border-gray-300 rounded-md text-sm py-1.5 px-3 bg-white hover:bg-gray-50 flex items-center gap-1.5 min-w-[120px]">
        <span x-text="selectedGroups.length === 0 ? (lang==='zh' ? '所有组别' : 'All Groups') : (lang==='zh' ? '已选 ' + selectedGroups.length + ' 个组别' : selectedGroups.length + ' Selected')"></span>
        <svg class="w-3.5 h-3.5 text-gray-400 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
</div>

                <!-- 关键词搜索 -->
                <div class="relative">
                    <input type="text" x-model="searchQuery" :placeholder="t('search')" class="border-gray-300 border rounded-md text-sm py-1.5 pl-3 pr-8 focus:ring-indigo-500 focus:border-indigo-500 w-64">
                    <svg class="w-4 h-4 text-gray-400 absolute right-2 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div class="flex gap-2 ml-auto">
    <!-- 版本信息 -->
    <div class="text-xs text-gray-500 flex items-center mr-4">
        <span x-text="t('currentVersion') + ' v' + db.meta.version"></span>
        <span x-text="' | ' + t('lastEdit') + ': ' + db.meta.lastEditor + ' ' + db.meta.lastEditTime"></span>
    </div>
    
    <!-- 编辑模式切换 -->
    <button 
    @click="toggleEditMode"
    :disabled="isLocked"
    x-show="currentView === 'matrix'"
    class="bg-indigo-600 text-white px-3 py-1 rounded text-sm disabled:bg-gray-400 disabled:cursor-not-allowed">

    <span x-text="editMode ? t('exitEdit') : t('edit')"></span>
    <span x-if="isLocked" class="ml-2 text-xs bg-red-500 px-1.5 py-0.5 rounded">
        <span x-text="lang==='zh' ? '已锁定' : 'Locked'"></span>
    </span>

</button>

    <button x-show="editMode && currentView === 'matrix'" @click="exportData"
        class="bg-blue-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '导出' : 'Export'"></span>
    </button>

    <button x-show="editMode && currentView === 'matrix'" @click="triggerImport"
        class="bg-blue-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '导入' : 'Import'"></span>
    </button>
    <input type="file" id="importFile" accept=".json" class="hidden" @change="importData">

    <button x-show="editMode" @click="triggerSave"
        class="bg-green-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '保存' : 'Save'"></span>
    </button>

    <button x-show="editMode" @click="addItem"
        class="bg-purple-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '+条目' : '+Item'"></span>
    </button>

    <button x-show="editMode" @click="addMarket"
        class="bg-purple-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '+国家' : '+Market'"></span>
    </button>
    
    <button x-show="editMode && currentView === 'matrix'" @click.stop="showHistoryModal()"
        class="bg-gray-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '历史版本' : 'History'"></span>
    </button>

    <button x-show="editMode" @click="manageGroups = !manageGroups"
        class="bg-purple-600 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '管理组别' : 'Manage Groups'"></span>
    </button>

    <button x-show="editMode" @click="showChangePwdModal = true"
        class="bg-gray-500 text-white px-3 py-1 rounded text-sm">
        <span x-text="lang==='zh' ? '修改密码' : 'Change Password'"></span>
    </button>
                </div>
            </div>
        </div>
        
        <!-- 组别管理界面 -->
        <div x-show="manageGroups" class="bg-gray-50 border-t border-gray-200 py-4 px-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-semibold text-gray-700" x-text="lang==='zh' ? '组别管理' : 'Group Management'"></h3>
                <button @click="manageGroups = false" class="text-xs text-gray-500 hover:text-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- 现有组别 -->
            <div class="space-y-2 mb-4">
                <template x-for="group in groups" :key="group.id">
                    <div class="flex items-center gap-2">
                        <input x-model="group.name.zh" class="text-sm border rounded px-2 py-1 flex-1" placeholder="中文名称" @blur="handleGroupTranslate('zh', group)" @input="dirty = true">
                        <input x-model="group.name.en" class="text-sm border rounded px-2 py-1 flex-1" placeholder="English Name" @blur="handleGroupTranslate('en', group)" @input="dirty = true">
                        <button @click="confirmDeleteGroup(group.id)" class="text-xs text-red-500 hover:text-red-700">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </template>
            </div>
            
            <!-- 添加新组别 -->
            <div class="flex items-center gap-2">
                <input x-model="newGroupName.zh" class="text-sm border rounded px-2 py-1 flex-1" placeholder="中文名称" @blur="handleNewGroupTranslate('zh')" @input="dirty = true">
                <input x-model="newGroupName.en" class="text-sm border rounded px-2 py-1 flex-1" placeholder="English Name" @blur="handleNewGroupTranslate('en')" @input="dirty = true">
                <button @click="addGroup" class="bg-green-500 text-white text-xs px-2 py-1 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 组别筛选下拉面板（脱离header，避免被sticky裁剪） -->
    <div x-show="groupDropdownOpen" x-transition.opacity
         @click.away="groupDropdownOpen = false"
         class="fixed bg-white border border-gray-200 rounded-lg shadow-xl py-1 min-w-[160px]"
         :style="'z-index:9999;top:' + groupDropdownPos.top + 'px;left:' + groupDropdownPos.left + 'px'">
        <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm" @click="toggleGroupFilter('all'); $event.stopPropagation()">
            <span class="w-4 h-4 rounded border flex items-center justify-center text-xs"
                :class="selectedGroups.length === 0 ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-300'">
                <span x-show="selectedGroups.length === 0">✓</span>
            </span>
            <span x-text="lang==='zh' ? '全部' : 'All'" class="font-medium"></span>
        </label>
        <div class="border-t border-gray-100 my-1"></div>
        <template x-for="group in groups" :key="group.id">
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm" @click="toggleGroupFilter(group.id); $event.stopPropagation()">
                <span class="w-4 h-4 rounded border flex items-center justify-center text-xs"
                    :class="selectedGroups.includes(group.id) ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-300'">
                    <span x-show="selectedGroups.includes(group.id)">✓</span>
                </span>
                <span x-text="getLangText(group.name)"></span>
            </label>
        </template>
    </div>

    <!-- 历史版本模态框 -->
    <div x-show="showHistory"  
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[9999]"  
         x-cloak  >
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto shadow-2xl" @click.away="showHistory = false">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-indigo-900" x-text="lang==='zh' ? '查看历史快照' : 'Version History'"></h3>
                <button @click="showHistory = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-3">
                <!-- 情况 A: 没历史记录 -->
                <template x-if="!db.history || db.history.length === 0">
                    <div class="text-gray-500 text-center py-10 bg-gray-50 rounded-lg border-2 border-dashed">
                        <p x-text="lang==='zh' ? '当前没有已保存的历史版本' : 'No history snapshots found'"></p>
                        <p class="text-xs mt-2 text-gray-400" x-text="lang==='zh' ? '提示：只有在编辑模式下点击“保存”按钮才会创建历史快照。' : 'Tip: Snapshots are created only when you click Save.'"></p>
                    </div>
                </template>
                
                <!-- 情况 B: 有历史记录 -->
                <template x-if="db.history && db.history.length > 0">
                    <template x-for="(entry, index) in db.history" :key="index">
                        <div class="border rounded-lg p-4 hover:bg-indigo-50 flex justify-between items-center transition shadow-sm bg-white">
                            <div>
                                <div class="font-bold text-indigo-600" x-text="'Version v' + entry.version"></div>
                                <div class="text-sm text-gray-700 font-medium">
                                    <span x-text="entry.editor"></span>
                                    <span class="text-xs text-gray-400 ml-2" x-text="'(' + entry.userId + ')'" x-show="entry.userId"></span>
                                </div>
                                <div class="text-xs text-gray-400" x-text="entry.time"></div>
                            </div>
                            <button @click.stop="restoreVersion(entry)" class="bg-indigo-600 text-white hover:bg-indigo-700 px-4 py-2 rounded text-sm font-semibold transition">
                                <span x-text="lang==='zh' ? '恢复此版本' : 'Restore'"></span>
                            </button>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <main class="w-full px-6 py-4">

        <!-- ================= 视图 1: 矩阵对比 (Matrix View) ================= -->
        <div x-show="currentView === 'matrix'" x-transition.opacity>
    
    <div class="mb-4 flex justify-between items-end">
        
        <!-- 标题 -->
        <h2 
            class="text-xl font-semibold text-gray-800"
            x-text="lang==='zh' ? '法规差异宏观矩阵' : 'Global Regulation Matrix'">
        </h2>

        <!-- 图例 -->
        <p class="text-xs text-gray-500 hidden sm:block">
            
            <span x-text="lang==='zh' ? '图例：' : 'Legend:'"></span>

            <!-- 不满足 -->
            <span class="inline-flex items-center ml-2">
                <span class="inline-block w-3 h-3 bg-red-100 border-l-4 border-red-500 mr-1"></span>
                <span x-text="lang==='zh' ? '不满足' : 'Not Fullfill'"></span>
            </span>

            <!-- 开放点/需测试 -->
            <span class="inline-flex items-center ml-2">
                <span class="inline-block w-3 h-3 bg-yellow-100 border-l-4 border-yellow-500 mr-1"></span>
                <span x-text="lang==='zh' ? '开放点/需测试' : 'Open/Need Test'"></span>
            </span>

            <!-- 满足 -->
            <span class="inline-flex items-center ml-2">
                <span class="inline-block w-3 h-3 bg-green-100 border-l-4 border-green-500 mr-1"></span>
                <span x-text="lang==='zh' ? '满足' : 'Fullfill'"></span>
            </span>

        </p>
    </div>

    <div class="overflow-x-auto overflow-y-auto bg-white rounded-lg shadow border border-gray-200" style="height: calc(100vh - 160px); min-width: 800px;">
        <table class="table-fixed w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 sticky top-0 z-20">
                <tr>

                    <!-- 左表头 -->
                    <th 
                        class="w-64 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky left-0 bg-gray-50 z-30 shadow-r"
                        x-text="lang==='zh' ? '法规条目 / 组别' : 'Regulation Item / Category'">
                    </th>
                            <template x-for="market in filteredMarkets" :key="market.code">
    <th class="w-48 px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider bg-gray-50">

    <!-- 展示模式 -->
    <template x-if="!editMode">
        <div>
            <div x-text="getLangText(market.name) + ' (' + getLangText(market.standard) + ')'" class="mb-2"></div>
            
            <!-- 筛选按钮 -->
            <div class="flex flex-col space-y-1">
                <!-- 状态筛选 -->
                <div class="flex justify-center gap-3">
                    <!-- 不满足 -->
                    <div class="flex items-center gap-1">
                        <button 
                            @click="toggleMarketFilter(market.code, 'not_fullfill')"
                            class="w-4 h-4 border-l-2 border-red-500 bg-red-100"
                            :class="isMarketFilterActive(market.code, 'not_fullfill') ? 'ring-2 ring-red-500' : ''"
                            title="不满足"
                        ></button>
                        <span class="text-xs" x-text="marketStatusCounts[market.code]?.not_fullfill || 0"></span>
                    </div>
                    
                    <!-- 开放点/需测试 -->
                    <div class="flex items-center gap-1">
                        <button 
                            @click="toggleMarketFilter(market.code, 'open_need_test')"
                            class="w-4 h-4 border-l-2 border-yellow-500 bg-yellow-100"
                            :class="isMarketFilterActive(market.code, 'open_need_test') ? 'ring-2 ring-yellow-500' : ''"
                            title="开放点/需测试"
                        ></button>
                        <span class="text-xs" x-text="marketStatusCounts[market.code]?.open_need_test || 0"></span>
                    </div>
                    
                    <!-- 满足 -->
                    <div class="flex items-center gap-1">
                        <button 
                            @click="toggleMarketFilter(market.code, 'fullfill')"
                            class="w-4 h-4 border-l-2 border-green-500 bg-green-100"
                            :class="isMarketFilterActive(market.code, 'fullfill') ? 'ring-2 ring-green-500' : ''"
                            title="满足"
                        ></button>
                        <span class="text-xs" x-text="marketStatusCounts[market.code]?.fullfill || 0"></span>
                    </div>
                </div>
                
                <!-- 清除筛选 -->
                <button 
                    @click="clearMarketFilter(market.code)"
                    class="text-xs text-gray-500 hover:text-gray-700 mt-1"
                    x-show="hasMarketFilter(market.code)"
                    x-text="lang==='zh' ? '清除筛选' : 'Clear Filter'"
                ></button>
            </div>
        </div>
    </template>

    <!-- 编辑模式 -->
    <template x-if="editMode">
        <div class="space-y-1">
            <input x-model="market.name[lang]"
                class="border text-xs p-1 w-full"
                @blur="handleMarketTranslate('name', market)"
                @input="dirty = true">

            <input x-model="market.standard[lang]"
                class="border text-xs p-1 w-full"
                @blur="handleMarketTranslate('standard', market)"
                @input="dirty = true">

            <button @click="confirmDeleteMarket(market.code)"
                class="text-xs text-red-500 hover:text-red-700"
                x-text="lang==='zh' ? '删除' : 'Delete'">
        </div>
    </template>

</th>
</template>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="(item, index) in filteredItems" :key="item.id">
                            <tr class="hover:bg-gray-50 transition group">
                                <!-- 左侧固定列：条目信息 -->
                                <td class="w-64 h-24 px-4 py-3 whitespace-normal sticky left-0 bg-white z-10 border-r border-gray-100 group-hover:bg-gray-50 overflow-hidden">
                                    <template x-if="!editMode">
                                        <span class="inline-block bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold mr-1.5 mb-1" x-text="getGroupName(item.groupId)"></span>
                                    </template>
                                    <template x-if="editMode">
                                        <select x-model="item.groupId" class="text-[10px] border rounded px-1 py-0.5 mb-1 font-bold"
                                            @change="dirty = true">
                                            <template x-for="group in groups" :key="group.id">
                                                <option :value="group.id" x-text="getLangText(group.name)"></option>
                                            </template>
                                        </select>
                                    </template>
                                    <template x-if="!editMode">
    <div class="text-sm font-bold text-indigo-700" x-text="getLangText(item.title)"></div>
</template>

<template x-if="editMode">
    <input x-model="item.title[lang]"
        class="border text-sm p-1 w-full mb-1"
        @blur="handleItemTranslate('title', item)"
        @input="dirty = true">
</template>

<template x-if="!editMode">
    <div class="text-xs font-mono text-gray-500 mt-0.5" x-text="item.regCode"></div>
</template>

<template x-if="editMode">
    <input x-model="item.regCode"
        class="border text-xs p-1 w-full mt-1"
        @input="dirty = true">
</template>
                                    <button x-show="editMode"
    @click="confirmDeleteItem(item.id)"
    class="text-xs text-red-500 hover:text-red-700 mt-1"
    x-text="lang==='zh' ? '删除条目' : 'Delete Item'">
                                    <button 
    @click="toggleDetail(index)" 
    class="text-xs text-indigo-500 hover:text-indigo-700 mt-2 font-medium flex items-center">

    <span 
        x-text="
            expandedRow === index 
            ? (lang==='zh' ? '收起详情' : 'Collapse') 
            : (lang==='zh' ? '展开对比详情' : 'Expand Details')
        ">
    </span>

    <svg 
        class="w-3 h-3 ml-1 transform transition-transform"

async sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
},

async verifyEditPassword() {
    const inputHash = await this.sha256(this.editPasswordInput);
    if (inputHash === this.editPasswordHash) {
        this.showPasswordModal = false;
        this.editPasswordInput = '';
        this.passwordError = false;
        if(this.createLock()){
            this.originalData = {
                items: JSON.parse(JSON.stringify(this.items)),
                markets: JSON.parse(JSON.stringify(this.markets)),
                groups: JSON.parse(JSON.stringify(this.groups))
            };
            this.dirty = true;
            this.editMode = true;
        }
    } else {
        this.passwordError = true;
    }
},

async changeEditPassword(oldPwd, newPwd) {
    const oldHash = await this.sha256(oldPwd);
    if (oldHash !== this.editPasswordHash) {
        return false;
    }
    const newHash = await this.sha256(newPwd);
    if (!this.originalPasswordHash) {
        this.originalPasswordHash = this.editPasswordHash;
    }
    this.editPasswordHash = newHash;
    this.dirty = true;
    return true;
},

async handleChangePassword() {
    if (!this.changePwdOld || !this.changePwdNew || !this.changePwdConfirm) {
        this.changePwdError = this.lang === 'zh' ? '请填写所有字段' : 'Please fill in all fields';
        return;
    }
    if (this.changePwdNew !== this.changePwdConfirm) {
        this.changePwdError = this.lang === 'zh' ? '两次输入的新密码不一致' : 'New passwords do not match';
        return;
    }
    if (this.changePwdNew.length < 4) {
        this.changePwdError = this.lang === 'zh' ? '新密码至少4位' : 'Password must be at least 4 characters';
        return;
    }
    const success = await this.changeEditPassword(this.changePwdOld, this.changePwdNew);
    if (success) {
        this.showChangePwdModal = false;
        this.changePwdOld = '';
        this.changePwdNew = '';
        this.changePwdConfirm = '';
        this.changePwdError = '';
        alert(this.lang === 'zh' ? '密码修改成功！' : 'Password changed successfully!');
    } else {
        this.changePwdError = this.lang === 'zh' ? '旧密码错误' : 'Incorrect old password';
    }
},

toggleEditMode(){
    if(this.editMode){
        if(this.dirty){
            if(confirm(this.lang === 'zh' ? '退出编辑模式前是否保存更改？' : 'Do you want to save changes before exiting edit mode?')){
                // 标记为需要在保存后退出编辑模式
                this.exitAfterSave = true
                // 显示用户信息弹窗
                this.triggerSave()
                return // 暂停执行，等待用户输入
            } else {
                if(this.originalData){
                    this.items = JSON.parse(JSON.stringify(this.originalData.items))
                    this.markets = JSON.parse(JSON.stringify(this.originalData.markets))
                    this.groups = JSON.parse(JSON.stringify(this.originalData.groups))
                    this.newGroupName = { zh: '', en: '' }
                    this.dirty = false
                }
                if(this.originalPasswordHash){
                    this.editPasswordHash = this.originalPasswordHash
                    this.originalPasswordHash = null
                }
                this.manageGroups = false
                this.clearLock()
                this.editMode = false
            }
        } else {
            // 没有未保存的更改，直接退出
            this.manageGroups = false
            this.clearLock()
            this.editMode = false
        }
    } else {
        if(this.isLocked){
            alert(this.lang === 'zh' ? '文件已被其他用户锁定，无法编辑' : 'File is locked by another user, cannot edit')
            return
        }
        this.showPasswordModal = true
        this.editPasswordInput = ''
        this.passwordError = false
    }
},

        document.body.appendChild(maskDiv)

        setTimeout(() => {
            html2canvas(document.getElementById('modal-pdf-export-temp'), {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const { jsPDF } = window.jspdf
                const doc = new jsPDF('p', 'mm', 'a4')
                const pageWidth = doc.internal.pageSize.getWidth()
                const pageHeight = doc.internal.pageSize.getHeight()
                const imgWidth = pageWidth - 10
                const scaleFactor = imgWidth / canvas.width
                const imgHeight = canvas.height * scaleFactor
                const pageContentHeight = pageHeight - 10
                
                const totalPages = Math.ceil(imgHeight / pageContentHeight)
                const sourcePageHeight = canvas.height / totalPages
                
                for (let i = 0; i < totalPages; i++) {
                    if (i > 0) {
                        doc.addPage()
                    }
                    
                    const startY = i * sourcePageHeight
                    const endY = Math.min(startY + sourcePageHeight, canvas.height)
                    const croppedHeight = endY - startY
                    
                    const croppedCanvas = document.createElement('canvas')
                    croppedCanvas.width = canvas.width
                    croppedCanvas.height = croppedHeight
                    const ctx = croppedCanvas.getContext('2d')
                    ctx.drawImage(canvas, 0, startY, canvas.width, croppedHeight, 0, 0, canvas.width, croppedHeight)
                    
                    const croppedImgData = croppedCanvas.toDataURL('image/png')
                    doc.addImage(croppedImgData, 'PNG', 5, 5, imgWidth, croppedHeight * scaleFactor)
                }

                doc.save(this.getLangText(this.activeItem.title) + '_' + this.getLangText(this.activeMarket.name) + '.pdf')
                document.body.removeChild(document.getElementById('modal-pdf-export-temp'))
                document.body.removeChild(document.getElementById('modal-pdf-export-mask'))
                this.showExportModal = false
            }).catch(err => {
                console.error('PDF导出失败:', err)
                alert(this.lang === 'zh' ? 'PDF导出失败，请重试！' : 'PDF export failed, please try again!')

                if(maskEl && maskEl.parentNode) {
                    document.body.removeChild(maskEl)
                }
                this.showExportModal = false
            })
        }, 300)
    }

//中英文切换
lang: 'zh',
getLangText(val){
    // 防止 null / undefined
    if(val === null || val === undefined) return ''

    // 如果是对象
    if(typeof val === 'object'){
        return val[this.lang] ?? val.zh ?? val.en ?? ''
    }

    // 如果是字符串（已经被污染）
    return val
},
normalizeText(val){
    // 已经是多语言对象
    if(typeof val === 'object' && val !== null){
        return val
    }

    // 如果是 "中文 (English)" 这种
    if(typeof val === 'string' && val.includes('(')){
        const match = val.match(/(.*)\((.*)\)/)
        if(match){
            return {
                zh: match[1].trim(),
                en: match[2].trim()
            }
        }
    }

    // 普通字符串 → 两边都一样
    return {
        zh: val || '',
        en: val || ''
    }
},
                // 获取单元格背景样式
                getCellClass(item, marketCode) {

                    if (!detail) return '';

                    if (detail.status === 'open_need_test') return 'diff-med';

                // 获取徽章颜色 (背景色)
                getBadgeColor(item, marketCode) {
                    const detail = item.details[marketCode];
                    if (!detail) return 'bg-gray-200 text-gray-500';
                    if (detail.status === 'not_fullfill') return 'bg-red-500 text-white';
                    if (detail.status === 'open_need_test') return 'bg-yellow-500 text-white';
                    return 'bg-green-500 text-white';
                },

                // 获取状态颜色文字描述
                getStatusColor(status) {
                    if (status === 'not_fullfill') return this.lang === 'zh' ? '红色' : 'Red';
                    if (status === 'open_need_test') return this.lang === 'zh' ? '黄色' : 'Yellow';
                    return this.lang === 'zh' ? '绿色' : 'Green';
                },

                // 获取状态颜色代码（用于PDF导出）
                getStatusColorForPDF(status) {
                    if (status === 'not_fullfill') return '#e74c3c';
                    if (status === 'open_need_test') return '#f39c12';
                    return '#27ae60';
                },
                
                // 获取徽章边框类 (用于条目视图)
                getBadgeBorderClass(item, marketCode) {
                    const detail = item.details[marketCode];
                    if (!detail) return 'border-gray-300 text-gray-500';
                    if (detail.status === 'not_fullfill') return 'border-red-500 text-red-600 bg-red-50';
                    if (detail.status === 'open_need_test') return 'border-yellow-500 text-yellow-600 bg-yellow-50';
                    return 'border-green-500 text-green-600 bg-green-50';
                },

                // 获取小圆点颜色
                getDotColor(item, marketCode) {
                     const detail = item.details[marketCode];
                    if (!detail) return 'bg-gray-300';
                    if (detail.status === 'not_fullfill') return 'bg-red-500';
                    if (detail.status === 'open_need_test') return 'bg-yellow-500';
                    return 'bg-green-500';

                getShortStatus(item, marketCode) {
    const map = { 
        not_fullfill: { zh:'不满足', en:'Not Fullfill' },
        open_need_test: { zh:'开放点/需测试', en:'Open/Need Test' },
        fullfill: { zh:'满足', en:'Fullfill' }
    };
    return this.getLangText(map[item.details[marketCode]?.status])
},

                getStatusLabel(item, marketCode) {
    const map = { 
        not_fullfill: { zh:'不满足', en:'Not Fullfill' },
        open_need_test: { zh:'开放点/需测试', en:'Open/Need Test' },
        fullfill: { zh:'满足', en:'Fullfill' }
    };

},

                getSummary(item, marketCode) {
                    return item.details[marketCode]?.summary || { zh: '暂无摘要', en: 'No summary available' };
                },

                getFullDetail(item, marketCode) {
                    return item.details[marketCode]?.full || { zh: '暂无详细解读', en: 'No detailed interpretation available' };
                },

                getSpecialRequirement(item, marketCode) {

                },

                getTestParam(item, marketCode) {
                    return item.details[marketCode]?.test || { zh: '标准测试程序', en: 'Standard test procedure' };
                },
                
                getTechHighlight(item, marketCode) {
                    // 提取测试参数的前几个字作为简短提示
                    const param = item.details[marketCode]?.test || '';
                    return param.length > 12 ? param.substring(0, 12) + '...' : param;
                },

                toggleDetail(index) {
                    if (this.expandedRow === index) {
                        this.expandedRow = null;
                    } else {
                        this.expandedRow = index;
                    }
                },

                openModal(item, market) {
                    this.activeItem = item;
                    this.activeMarket = market;
                    this.modalOpen = true;
                    this.$nextTick(() => {
                        document.querySelectorAll('.modal-textarea').forEach(el => {
                            const min = parseInt(el.dataset.minH) || 40
                            const max = parseInt(el.dataset.maxH) || 120
                            this.autoResize(el, min, max)
                        })
                    })
                },

                // 为市场视图提取高光点 (展示所有状态的条目，按红黄绿顺序)
                getMarketHighlights(marketCode) {
                    const statusOrder = { not_fullfill: 0, open_need_test: 1, fullfill: 2 };
                    const activeFilter = this.countryViewFilters[marketCode];
                    return this.items
                        .filter(item => {
                            const detail = item.details[marketCode];
                            if (!detail?.status) return false;
                            if (activeFilter && detail.status !== activeFilter) return false;
                            return true;
                        })
                        .sort((a, b) => {
                            const statusA = a.details[marketCode]?.status;
                            const statusB = b.details[marketCode]?.status;
                            return statusOrder[statusA] - statusOrder[statusB];
                        })
                        .map(item => ({
                            itemId: item.id,
                            text: this.getLangText(item.details[marketCode].summary) + '。' + 
      this.getLangText(item.details[marketCode].full).substring(0, 40) + '...'
                        }));
                },

                toggleCountryFilter(marketCode, status) {
                    if (!status || this.countryViewFilters[marketCode] === status) {
                        delete this.countryViewFilters[marketCode];
                        this.countryViewFilters = { ...this.countryViewFilters };
                    } else {
                        this.countryViewFilters[marketCode] = status;
                    }
                },

                // 检查锁
                checkLock(){ 
                    const editing = this.db.meta.editing
                    if(editing){
                        const now = Date.now()
                        if(now < editing.expire && editing.user !== this.currentUser){
                            this.isLocked = true
                        } else {
                            // 锁已过期，清除
                            this.db.meta.editing = null
                            this.isLocked = false
                        }
                    } else {
                        // 没有锁，设置为未锁定
                        this.isLocked = false
                    }
                },

                // 计算市场状态计数
                calculateMarketStatusCounts(){ 
                    this.marketStatusCounts = {};
                    this.markets.forEach(market => {
                        const counts = {
                            not_fullfill: 0,
                            open_need_test: 0,
                            fullfill: 0
                        };
                        // 只统计符合当前组别筛选条件的条目
                        const filteredItems = this.items.filter(item => {
                            return this.selectedGroups.length === 0 || this.selectedGroups.includes(item.groupId);
                        });
                        filteredItems.forEach(item => {
                            const status = item.details[market.code]?.status;
                            if(status){
                                counts[status]++;
                            }
                        });
                        this.marketStatusCounts[market.code] = counts;
                    });
                },

                // 切换市场筛选
                toggleMarketFilter(marketCode, status){ 
                    if(!this.marketFilters[marketCode]){
                        this.marketFilters[marketCode] = [];
                    }
                    const index = this.marketFilters[marketCode].indexOf(status);
                    if(index > -1){
                        this.marketFilters[marketCode].splice(index, 1);
                    } else {
                        this.marketFilters[marketCode].push(status);
                    }
                },

                // 清除市场筛选
                clearMarketFilter(marketCode){ 
                    delete this.marketFilters[marketCode];
                },

                // 检查市场筛选是否激活
                isMarketFilterActive(marketCode, status){ 
                    return this.marketFilters[marketCode]?.includes(status) || false;
                },

                // 检查市场是否有筛选
                hasMarketFilter(marketCode){ 
                    return this.marketFilters[marketCode]?.length > 0 || false;
                },
                
                // 创建锁
                createLock(){ 
                    if(this.isLocked) return false
                    
                    this.db.meta.editing = {
                        user: this.currentUser,
                        startTime: new Date().toLocaleString(),
                        expire: Date.now() + 30 * 1000 // 30秒过期
                    }
                    
                    // 开始定时刷新锁
                    this.startLockRefresh()
                    return true
                },
                
                // 刷新锁
                refreshLock(){ 
                    if(this.db.meta.editing && this.db.meta.editing.user === this.currentUser){
                        this.db.meta.editing.expire = Date.now() + 30 * 1000
                    }
                },
                
                // 开始定时刷新锁
                startLockRefresh(){ 
                    this.stopLockRefresh()
                    this.lockRefreshInterval = setInterval(() => {
                        this.refreshLock()
                    }, 10000) // 每10秒刷新一次
                },
                
                // 停止刷新锁
                stopLockRefresh(){ 
                    if(this.lockRefreshInterval){
                        clearInterval(this.lockRefreshInterval)
                        this.lockRefreshInterval = null
                    }
                },
                
                // 清除锁
                clearLock(){ 
                    if(this.db.meta.editing && this.db.meta.editing.user === this.currentUser){
                        this.db.meta.editing = null
                    }
                    this.stopLockRefresh()
                },
                

                
                // 显示历史版本模态框
                showHistoryModal() {
                    this.showHistory = true;
                },
                
                // 修改恢复版本的方法
                restoreVersion(entry) { 
                    if (!entry || !entry.data) return;
                    
                    const msg = this.lang === 'zh' ? 
                        `确定要恢复到版本 v${entry.version} 吗？当前未保存的修改将会丢失。` : 
                        `Restore to v${entry.version}? Unsaved changes will be lost.`;

                    if (confirm(msg)) {
                        // 使用解构赋值或重新赋值确保 Alpine.js 监听到变化
                        this.markets = JSON.parse(JSON.stringify(entry.data.markets));
                        this.groups = JSON.parse(JSON.stringify(entry.data.groups));
                        this.items = JSON.parse(JSON.stringify(entry.data.items));
                        
                        this.showHistory = false; // 关闭窗口
                        this.dirty = false;
                        alert(this.lang === 'zh' ? '版本已恢复' : 'Restored');
                    }
                },
                
                // 修改生成历史的方法
                saveHistory() { 
                    // 深度克隆当前数据，防止引用污染
                    const snapshot = {
                        version: this.db.meta.version,
                        editor: this.userInfo.name,
                        userId: this.userInfo.userId,
                        time: new Date().toLocaleString(),
                        data: {
                            markets: JSON.parse(JSON.stringify(this.markets)),
                            groups: JSON.parse(JSON.stringify(this.groups)),
                            items: JSON.parse(JSON.stringify(this.items))
                        }
                    };
                    
                    // 初始化数组防止报错
                    if (!this.db.history) this.db.history = [];
                    
                    // 插入到最前面
                    this.db.history.unshift(snapshot);
                    
                    // 限制条数
                    if (this.db.history.length > 15) {
                        this.db.history = this.db.history.slice(0, 15);
                    }
                },
                
                async init(){
    let loadedFromSupabase = false;
    
    try {
        const sb = getSupabaseClient();
        if (sb) {
            const { data, error } = await sb
                .from('app_data')
                .select('data')
                .eq('id', 'c8a5a3f0-2bb5-4ad1-9e08-8cb193b86007')
                .single();
            
            if (!error && data && data.data) {
                const dbData = data.data;
                this.db = {
                    meta: dbData.meta,
                    history: dbData.history || []
                };
                this.markets = dbData.current.markets;
                this.groups = dbData.current.groups;
                this.items = dbData.current.items;
                if (dbData.current.editPasswordHash) {
                    this.editPasswordHash = dbData.current.editPasswordHash;
                }
                loadedFromSupabase = true;
                this.dbConnected = true;
                localStorage.setItem('autoRegData', JSON.stringify(dbData));
                console.log('Data loaded from Supabase');
            } else if (error) {
                console.warn('Supabase load error:', error.message);
            }
        } else {
            console.warn('Supabase client not available');
        }
    } catch (e) {
        console.warn('Supabase connection failed, falling back to localStorage:', e.message);
    }
    
    if (!loadedFromSupabase) {
        const saved = localStorage.getItem('autoRegData');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                
                if (data.meta && data.current) {
                    this.db = {
                        meta: data.meta,
                        history: data.history || []
                    };
                    this.markets = data.current.markets;
                    this.groups = data.current.groups;
                    this.items = data.current.items;
                    if (data.current.editPasswordHash) {
                        this.editPasswordHash = data.current.editPasswordHash;
                    }
                } else if (data.db) {
                    this.db = data.db;
                    if (data.db.current) {
                        this.markets = data.db.current.markets;
                        this.groups = data.db.current.groups;
                        this.items = data.db.current.items;
                        if (data.db.current.editPasswordHash) {
                            this.editPasswordHash = data.db.current.editPasswordHash;
                        }
                    }
                } else {
                    this.markets = data.markets || [];
                    this.groups = data.groups || [];
                    this.items = data.items || [];
                    this.db = {
                        meta: {
                            version: 1,
                            lastEditor: '',
                            lastEditTime: new Date().toLocaleString(),
                            editing: null
                        },
                        history: []
                    };
                }
                console.log('Data loaded from localStorage (offline mode)');
            } catch (e) {
                console.error('Failed to parse saved data', e);
            }
        }
    }

    // 迁移 standardFile → standardFiles
    this.items.forEach(item => {
        Object.values(item.details).forEach(d => {
            if(d.standardFile && !d.standardFiles){
                if(typeof d.standardFile === 'string'){
                    d.standardFiles = [{ data: d.standardFile, name: 'preview', type: '' }]
                } else if(typeof d.standardFile === 'object' && d.standardFile !== null){
                    d.standardFiles = [d.standardFile]
                }
                delete d.standardFile
            }
            if(!d.standardFiles){
                d.standardFiles = []
            }
        })
    })

    if (!this.db.history) {
        this.db.history = [];
    }

    // 清理异常锁
    const editing = this.db.meta.editing
    if(editing){
        if(Date.now() > editing.expire){
            this.db.meta.editing = null
        }
    }

    // 检查锁
    this.checkLock()

    // 页面关闭自动清锁
    window.addEventListener('beforeunload', () => {
        if(this.db.meta.editing?.user === this.currentUser){
            this.db.meta.editing = null
        }
    })

    // 计算市场状态计数
    this.calculateMarketStatusCounts()

    // 监听数据变化，重新计算市场状态计数
    this.$watch('items', () => {
        this.calculateMarketStatusCounts()
        if(!this.editMode) this.save()
    }, { deep: true })
    this.$watch('markets', () => {
        this.calculateMarketStatusCounts()
        if(!this.editMode) this.save()
    }, { deep: true })
    this.$watch('groups', () => {
        if(!this.editMode) this.save()
    }, { deep: true })
    this.$watch('selectedGroups', () => {
        this.calculateMarketStatusCounts()
    })
},

    this._saveTimer = setTimeout(async ()=>{
        if(!this.db){
            this.db = {
                meta: {
                    version: 1,
                    lastEditor: '',
                    lastEditTime: new Date().toLocaleString(),
                    editing: null
                },
                history: []
            }
        }
        
        const dbData = {
            meta: this.db.meta,
            current: {
                markets: this.markets,
                groups: this.groups,
                items: this.items,
                editPasswordHash: this.editPasswordHash
            },
            history: this.db.history
        }
        
        try {
            const sb = getSupabaseClient();
            if (sb) {
                const { error } = await sb
                    .from('app_data')
                    .upsert({
                        id: 'c8a5a3f0-2bb5-4ad1-9e08-8cb193b86007',
                        data: dbData,
                        updated_at: new Date().toISOString()
                    });
                
                if (error) {

                    this.dbConnected = false;

                } else {

                    localStorage.setItem('autoRegData', JSON.stringify(dbData));

                localStorage.setItem('autoRegData', JSON.stringify(dbData));
            }
        } catch (e) {
            console.warn('Supabase connection error, saving to localStorage:', e.message);
            this.dbConnected = false;
            localStorage.setItem('autoRegData', JSON.stringify(dbData));
        }
    }, 500)
},

// 导入JSON文件数据
importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const importedData = JSON.parse(e.target.result);
            
            if (importedData.meta && importedData.current) {
                // 验证数据结构
                if (Array.isArray(importedData.current.markets) && 
                    Array.isArray(importedData.current.groups) && 
                    Array.isArray(importedData.current.items)) {
                    
                    const confirmMsg = this.lang === 'zh' ? 
                        '确定要导入数据吗？当前未保存的修改将会丢失。' : 
                        'Import data? Unsaved changes will be lost.';
                    
                    if (confirm(confirmMsg)) {
                        // 导入数据
                        this.db = {
                            meta: importedData.meta,
                            history: importedData.history || []
                        };
                        this.markets = importedData.current.markets;
                        this.groups = importedData.current.groups;
                        this.items = importedData.current.items;
                        
                        this.dirty = false;
                        this.save();
                        alert(this.lang === 'zh' ? '导入成功！' : 'Import successful!');
                    }
                } else {
                    alert(this.lang === 'zh' ? '无效的数据格式！' : 'Invalid data format!');
                }
            } else {
                alert(this.lang === 'zh' ? '无效的数据格式！' : 'Invalid data format!');
            }
        } catch (error) {
            alert(this.lang === 'zh' ? '文件解析失败！' : 'File parsing failed!');
            console.error('Import error:', error);
        }
    };
    reader.readAsText(file);
    
    // 重置文件输入，允许重复选择同一个文件
    event.target.value = '';
},

// 上传标准原文文件
uploadStandardFile(item, marketCode, event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const maxSize = 10 * 1024 * 1024;
    if (file.size > maxSize) {
        alert(this.lang === 'zh' ? '单个文件大小不能超过 10MB！' : 'Single file size cannot exceed 10MB!');
        return;
    }
    
    const currentFiles = item.details[marketCode]?.standardFiles || [];
    const totalSize = currentFiles.reduce((sum, f) => {
        return sum + (f.data ? Math.ceil(f.data.length * 0.75) : 0);
    }, 0) + file.size;
    
    if (totalSize > 20 * 1024 * 1024) {
        if (!confirm(this.lang === 'zh' 
            ? '文件总大小已超过 20MB，可能导致浏览器存储不足。是否继续？' 
            : 'Total file size exceeds 20MB, may cause browser storage issues. Continue?')) {
            return;
        }
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            if (!item.details[marketCode].standardFiles) {
                item.details[marketCode].standardFiles = [];
            }
            item.details[marketCode].standardFiles.push({
                data: e.target.result,
                name: file.name,
                type: file.type
            });
            this.dirty = true;
        } catch (error) {
            alert(this.lang === 'zh' ? '文件上传失败！' : 'File upload failed!');
            console.error('Upload error:', error);
        }
    };
    reader.readAsDataURL(file);
    
    event.target.value = '';
},

removeStandardFile(item, marketCode, index) {
    if (confirm(this.lang === 'zh' ? '确定删除此文件？' : 'Delete this file?')) {
        item.details[marketCode].standardFiles.splice(index, 1);
        this.dirty = true;
    }
},

openFilePreview(fileData) {
    if (!fileData) return;

    let dataUrl, fileName, mimeType;

    if (typeof fileData === 'object' && fileData.data) {
        dataUrl = fileData.data;
        fileName = fileData.name || 'preview';
        mimeType = fileData.type || '';
    } else if (typeof fileData === 'string') {
        dataUrl = fileData;
        fileName = 'preview';
        mimeType = '';
    } else {
        return;
    }

    if (!dataUrl.startsWith('data:')) {
        window.open(dataUrl, '_blank');
        return;
    }

    const blob = this.dataURLtoBlob(dataUrl);
    const url = URL.createObjectURL(blob);

    if (!mimeType) {
        mimeType = dataUrl.split(';')[0].split(':')[1] || '';
    }

    const isPdf = mimeType === 'application/pdf';
    const isImage = mimeType.startsWith('image/');
    const isText = mimeType.startsWith('text/') || ['text/plain','text/csv','text/html','text/xml','application/json','application/xml'].includes(mimeType);
    const isOffice = [
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        'application/vnd.ms-excel',
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        'application/vnd.ms-powerpoint',
        'application/vnd.openxmlformats-officedocument.presentationml.presentation'
    ].includes(mimeType);

    if (isPdf) {
        window.open(url, '_blank');
    } else if (isImage) {
        const win = window.open('', '_blank');
        if (win) {
            win.document.write('<html><head><title>' + fileName + '</title></head><body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f3f4f6"><img src="' + url + '" style="max-width:100%;max-height:100vh"></body></html>');
            win.document.close();
        }
    } else if (isText) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            const win = window.open('', '_blank');
            if (win) {
                win.document.write('<html><head><title>' + fileName + '</title><style>body{font-family:monospace;white-space:pre-wrap;padding:20px;font-size:14px;line-height:1.6;}</style></head><body>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</body></html>');
                win.document.close();
            }
        };
        reader.readAsText(blob);
    } else if (isOffice) {
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        alert(this.lang === 'zh' ? 'Office 文件暂不支持在线预览，已自动下载。请用本地软件打开查看。' : 'Office files cannot be previewed in browser. File has been downloaded. Please open with local software.');
    } else {
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
},

dataURLtoBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const b64 = atob(parts[1]);
    const arr = new Uint8Array(b64.length);
    for (let i = 0; i < b64.length; i++) arr[i] = b64.charCodeAt(i);
    return new Blob([arr], { type: mime });
},

uploadGuideFile(market, event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const maxSize = 10 * 1024 * 1024;
    if (file.size > maxSize) {
        alert(this.lang === 'zh' ? '文件大小不能超过 10MB！' : 'File size cannot exceed 10MB!');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            market.guideFile = {
                data: e.target.result,
                name: file.name,
                type: file.type
            };
            this.dirty = true;
            alert(this.lang === 'zh' ? '文件上传成功！' : 'File uploaded successfully!');
        } catch (error) {
            alert(this.lang === 'zh' ? '文件上传失败！' : 'File upload failed!');
            console.error('Upload error:', error);
        }
    };
    reader.readAsDataURL(file);
    
    event.target.value = '';
}
            }
        }
